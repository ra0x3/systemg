version: "2"
logs:
  sink: none
services:
  db:
    command: "/svc/svc.sh db"
  queue:
    command: "/svc/svc.sh queue"
  cache:
    command: "/svc/svc.sh cache"
    depends_on:
      - db
  worker1:
    command: "/svc/svc.sh worker1"
    depends_on:
      - cache
  worker2:
    command: "/svc/svc.sh worker2"
    depends_on:
      - cache
  worker3:
    command: "/svc/svc.sh worker3"
    depends_on:
      - cache
  ingest1:
    command: "/svc/svc.sh ingest1"
    depends_on:
      - queue
  ingest2:
    command: "/svc/svc.sh ingest2"
    depends_on:
      - queue
  aggregator:
    command: "/svc/svc.sh aggregator"
    depends_on:
      - worker1
      - worker2
      - worker3
      - ingest1
      - ingest2
  reporter:
    command: "/svc/svc.sh reporter"
    depends_on:
      - aggregator
