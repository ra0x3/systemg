version: "2"
logs:
  sink: none
services:
  db:
    command: "/svc/svc.sh db"
    deployment:
      health_check:
        command: "test -f /ready/db"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  queue:
    command: "/svc/svc.sh queue"
    deployment:
      health_check:
        command: "test -f /ready/queue"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  cache:
    command: "/svc/svc.sh cache"
    depends_on:
      - db
    deployment:
      health_check:
        command: "test -f /ready/cache"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  worker1:
    command: "/svc/svc.sh worker1"
    depends_on:
      - cache
    deployment:
      health_check:
        command: "test -f /ready/worker1"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  worker2:
    command: "/svc/svc.sh worker2"
    depends_on:
      - cache
    deployment:
      health_check:
        command: "test -f /ready/worker2"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  worker3:
    command: "/svc/svc.sh worker3"
    depends_on:
      - cache
    deployment:
      health_check:
        command: "test -f /ready/worker3"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  ingest1:
    command: "/svc/svc.sh ingest1"
    depends_on:
      - queue
    deployment:
      health_check:
        command: "test -f /ready/ingest1"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  ingest2:
    command: "/svc/svc.sh ingest2"
    depends_on:
      - queue
    deployment:
      health_check:
        command: "test -f /ready/ingest2"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  aggregator:
    command: "/svc/svc.sh aggregator"
    depends_on:
      - worker1
      - worker2
      - worker3
      - ingest1
      - ingest2
    deployment:
      health_check:
        command: "test -f /ready/aggregator"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
  reporter:
    command: "/svc/svc.sh reporter"
    depends_on:
      - aggregator
    deployment:
      health_check:
        command: "test -f /ready/reporter"
        interval: "1s"
        attempt_timeout: "5s"
        total_timeout: "60s"
