daemon off;
user www-data;
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream app {
        include /tmp/upstream.conf;
    }

    server {
        listen 127.0.0.1:18090;

        location / {
            proxy_pass http://app;
        }
    }
}
