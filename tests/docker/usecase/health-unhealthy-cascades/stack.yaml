version: "2"
projects:
  stream:
    name: Stream
    services:
      display:
        command: "python3 -u /usecase/probe.py"
        restart_policy: "always"
        deployment:
          health_check:
            url: "http://127.0.0.1:18080/health"
            interval: "2s"
            retries: 2
      browser:
        command: "sleep 3000"
        restart_policy: "always"
        depends_on: ["display"]
