version: "3"
projects:
  boxed:
    name: Boxed
    services:
      confined:
        command: "sh -c 'cat /allowed/ok.txt && (cat /secret/deny.txt 2>/dev/null && echo LEAK || echo DENIED) ; sleep 300'"
        isolation:
          landlock:
            ro_paths: ["/allowed", "/bin", "/lib", "/usr"]
      seccombed:
        command: "sh -c 'echo hello && (chmod 777 /allowed/ok.txt 2>/dev/null && echo CHMOD_OK || echo CHMOD_BLOCKED) ; sleep 300'"
        isolation:
          seccomp: "baseline-v1"
